							className={`absolute top-0 left-0 right-0 z-[2000] bg-amber-500 text-white text-center py-2 text-[11px] font-black uppercase tracking-widest transition ${error ? 'hover:bg-amber-600 cursor-pointer' : 'cursor-default'}`}>
							⚠ Mock Mode Active — {errorIsExternal ? 'AI provider temporarily unavailable (not an app fault)' : 'AI interpreter unavailable'}. Results are illustrative only.{error && <span className="underline decoration-2 underline-offset-2"> Tap for details</span>}
						</button>
					)}
                    <div className={`absolute right-4 z-[1000] flex gap-2 transition-all ${isMockMode ? 'top-12' : 'top-4'}`}>
                        <button onClick={() => setUiMode('intent')} className={`px-4 py-2 rounded-full text-xs font-bold shadow-lg transition ${uiMode === 'intent' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600'}`}>INTENT</button>
                        <button
                            onClick={() => { if (!isMockMode) setUiMode('map'); }}
                            disabled={isMockMode}
                            title={isMockMode ? 'Unavailable while using simplified backup logic' : ''}
                            className={`px-4 py-2 rounded-full text-xs font-bold shadow-lg transition ${uiMode === 'map' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600'} ${isMockMode ? 'opacity-40 cursor-not-allowed' : ''}`}>MAP</button>
                        <button
                            onClick={() => { if (!isMockMode) setUiMode('report'); }}
                            disabled={isMockMode}
                            title={isMockMode ? 'Unavailable while using simplified backup logic' : ''}
                            className={`px-4 py-2 rounded-full text-xs font-bold shadow-lg transition ${uiMode === 'report' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600'} ${isMockMode ? 'opacity-40 cursor-not-allowed' : ''}`}>REPORT</button>
                    </div>

                    {/* INTENT SCREEN */}
                    <div className={`flex-1 bg-slate-50 overflow-y-auto p-8 ${isMockMode ? 'pt-28' : 'pt-20'} ${uiMode === 'intent' ? '' : 'hidden'}`}>
                        <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                            {/* Input Panel */}
                            <div className="space-y-6">
                                <section className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                    <h2 className="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tight">Investor Input</h2>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase mb-6 tracking-widest">Phase A Deterministic Backbone</p>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Business Description</label>
											<textarea 
												value={investorDescription}
												onChange={(e) => setInvestorDescription(e.target.value)}
												placeholder="e.g. I want to open a small independent coffee shop with some bakery items."
												readOnly={!!interpretedIntent}
												className={`w-full h-32 p-4 border rounded-xl text-sm outline-none transition ${interpretedIntent ? 'bg-slate-100 border-slate-200 text-slate-500 cursor-not-allowed' : 'bg-slate-50 border-slate-200 focus:ring-2 focus:ring-slate-900'}`}
											/>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Investor Priorities (Comma separated)</label>
											<input 
												type="text"
												value={investorPriorities}
												onChange={(e) => setInvestorPriorities(e.target.value)}
												placeholder="e.g. high_visibility, low_competition, parking"
												readOnly={!!interpretedIntent}
												className={`w-full p-4 border rounded-xl text-sm outline-none transition ${interpretedIntent ? 'bg-slate-100 border-slate-200 text-slate-500 cursor-not-allowed' : 'bg-slate-50 border-slate-200 focus:ring-2 focus:ring-slate-900'}`}
											/>
                                        </div>
										{!apiKeySubmitted && (
											<div className="space-y-2">
												<label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Gemini API Key</label>
												<input
													type="password"
													value={geminiApiKey}
													onChange={(e) => { setGeminiApiKey(e.target.value); setKeyConfirmed(false); }}
													placeholder="Paste your Gemini API key here"
													className="w-full p-4 bg-amber-50 border border-amber-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-400 outline-none transition font-mono"
												/>
												<button
													onClick={confirmApiKey}
													disabled={!geminiApiKey.trim()}
													className={`w-full py-2 rounded-xl font-black text-[10px] uppercase tracking-widest transition ${!geminiApiKey.trim() ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : keyConfirmed ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-white hover:bg-amber-600'}`}>
													{keyConfirmed ? '✓ Key Confirmed' : 'Confirm API Key'}
												</button>
												<p className="text-[9px] text-slate-400 leading-tight">Key is used only in this session and never stored or transmitted elsewhere. Leave blank to run in mock mode.</p>
											</div>
										)}
										{apiKeySubmitted && (
											<div className="flex items-center gap-2 px-3 py-2 bg-emerald-50 border border-emerald-100 rounded-xl">
												<span className="text-emerald-500 text-xs">●</span>
												<span className="text-[10px] font-black text-emerald-700 uppercase tracking-widest">AI Interpreter Active</span>
												<button onClick={() => { setApiKeySubmitted(false); setGeminiApiKey(''); }} className="ml-auto text-[9px] text-slate-400 hover:text-slate-600 underline">Reset</button>
											</div>
										)}
										{!interpretedIntent ? (
											<button 
												onClick={runInterpreter}
												disabled={!investorDescription || isInterpreting}
												className={`w-full py-4 rounded-xl font-black text-xs uppercase tracking-widest transition ${!investorDescription || isInterpreting ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-900 text-white hover:bg-slate-800 shadow-lg'}`}>
												{isInterpreting ? 'Interpreting...' : 'Read Investor Intent'}
											</button>
										) : (
											<button 
												onClick={() => {
													setInvestorDescription('');
													setInvestorPriorities('');
													setInterpretedIntent(null);
													setClarificationResponse('');
													setTopMatches([]);
													setSelectedTract(null);
													setIsMockMode(false);
													setError(null);
													setErrorIsExternal(false);
													setShowErrorDialog(false);
												}}
												className="w-full py-4 rounded-xl font-black text-xs uppercase tracking-widest transition bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg">
												↩ Start New Search
											</button>
										)}
                                    </div>
                                </section>
                            </div>

                            {/* Result Panel */}
                            <div className="space-y-6">
                                {!interpretedIntent ? (
                                    <div className="h-full min-h-[400px] bg-slate-100/50 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center p-8 text-center">
                                        <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm">
                                            <span className="text-slate-300 text-xl">⚡</span>
                                        </div>
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Awaiting Intent Translation</p>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        <section className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 animate-in fade-in slide-in-from-right-4 duration-300">
                                            <div className="flex justify-between items-start mb-6">
                                                <div>
                                                    <h2 className="text-xl font-black text-slate-800 uppercase tracking-tight">Interpreted Profile</h2>
                                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{interpretedIntent.canonical_label}</p>
                                                    {interpretedIntent.generated_at && (
                                                        <p className="text-[9px] font-bold text-slate-300 uppercase tracking-tight mt-1">
                                                            Generated {new Date(interpretedIntent.generated_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'medium' })}
                                                        </p>
                                                    )}
                                                </div>
                                                <div className="flex flex-col items-end">
                                                    <div className={`px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest ${interpretedIntent.confidence > 0.7 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                        Confidence: {(interpretedIntent.confidence * 100).toFixed(0)}%
                                                    </div>
                                                    <p className="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">Ambiguity: {interpretedIntent.ambiguity_level.toUpperCase()}</p>
                                                </div>
                                            </div>

                                            <div className="space-y-6">
                                                <div className="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl">
                                                    <p className="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">Reasoning Summary</p>
                                                    <p className="text-xs font-medium text-indigo-900 leading-relaxed">{interpretedIntent.reasoning_summary}</p>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 italic">
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Customer Mode</p>
                                                        <p className="text-xs font-bold text-slate-700">{interpretedIntent.customer_mode.replace(/_/g, ' ')}</p>
                                                    </div>
                                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 italic">
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Space Profile</p>
                                                        <p className="text-xs font-bold text-slate-700">{interpretedIntent.space_profile.replace(/_/g, ' ')}</p>
                                                    </div>
                                                </div>

                                                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Primary Business Family</p>
                                                        {interpretedIntent.secondary_family_id && (
                                                            <span className="text-[9px] font-black text-indigo-500 uppercase">Sec: {interpretedIntent.secondary_family_id}</span>
                                                        )}
                                                    </div>
                                                    <p className="text-lg font-black text-slate-800">
                                                        {businessFamilies.find(f => f.id === interpretedIntent.business_family_id)?.label || interpretedIntent.business_family_id}
                                                    </p>
                                                    <div className="mt-2 flex flex-wrap gap-1">
                                                        {businessFamilies.find(f => f.id === interpretedIntent.business_family_id)?.examples.map(ex => (
                                                            <span key={ex} className="text-[9px] bg-white border border-slate-200 px-1.5 py-0.5 rounded text-slate-500">{ex}</span>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <div>
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Location Needs</p>
                                                        <div className="space-y-2">
                                                            {Object.entries(interpretedIntent.location_needs).filter(([, v]) => v > 0).map(([k, v]) => (
                                                                <div key={k} className="flex flex-col">
                                                                    <div className="flex justify-between text-[10px] font-bold mb-1">
                                                                        <span className="text-slate-500 uppercase">{k.replace(/_/g, ' ')}</span>
                                                                        <span className="text-slate-800">{(v * 100).toFixed(0)}%</span>
                                                                    </div>
                                                                    <div className="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                                                                        <div className="bg-indigo-500 h-full" style={{width: `${v * 100}%`}}></div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Activity Profile</p>
                                                        <div className="space-y-2">
                                                            {Object.entries(interpretedIntent.activity_profile).map(([k, v]) => (
                                                                <div key={k} className="flex flex-col">
                                                                    <div className="flex justify-between text-[10px] font-bold mb-1">
                                                                        <span className="text-slate-500 uppercase">{k.replace(/_/g, ' ')}</span>
                                                                        <span className="text-slate-800">{(v * 100).toFixed(0)}%</span>
                                                                    </div>
                                                                    <div className="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                                                                        <div className="bg-emerald-500 h-full" style={{width: `${v * 100}%`}}></div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Internal Flags</p>
                                                        <div className="flex flex-wrap gap-2">
                                                            {Object.entries(interpretedIntent.detected_flags).filter(([, v]) => v).map(([k]) => (
                                                                <span key={k} className="px-2 py-1 bg-red-50 text-red-600 rounded text-[10px] font-bold uppercase tracking-tight">{k.replace(/_/g, ' ')}</span>
                                                            ))}
                                                            {Object.values(interpretedIntent.detected_flags).every(v => !v) && <span className="text-[10px] text-slate-300 italic">No sensitive flags identified</span>}
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Interpretation Notes</p>
                                                        <div className="space-y-1">
                                                            {interpretedIntent.interpretation_notes.map((note, i) => (
                                                                <p key={i} className="text-[10px] text-slate-500 leading-tight">• {note}</p>
                                                            ))}
                                                        </div>
                                                    </div>

                                                        </div>
                                                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                            <p className="text-[10px] font-black text-slate-500 uppercase mb-1">Next Verification Steps</p>
                                                            <ul className="text-[11px] text-slate-600 list-disc pl-3 leading-tight space-y-1">
                                                                <li>Verify site-specific zoning ordinances</li>
                                                                <li>Assess car-based catchment bottlenecks</li>
                                                                <li>Validate specific niche local demand</li>
                                                            </ul>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                )}
                            </div>
                        </div>

                    {loading && (
                        <div className="absolute inset-0 z-[2000] bg-white flex flex-col items-center justify-center">
                            <div className="w-10 h-10 border-4 border-purple-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <span className="font-black text-slate-700 uppercase tracking-widest text-xs">Loading Data...</span>
                        </div>
                    )}

                    {error && showErrorDialog && (() => {
                        const isExternal = errorIsExternal;
                        return (
                        <div className="absolute inset-0 z-[2000] bg-white/90 flex flex-col items-center justify-center p-8 text-center">
                            <div className={`bg-white p-8 rounded-3xl shadow-2xl border max-w-md ${isExternal ? 'border-amber-200' : 'border-red-100'}`}>
                                <h2 className={`text-xl font-black mb-2 uppercase tracking-tight ${isExternal ? 'text-amber-600' : 'text-red-600'}`}>
                                    {isExternal ? 'AI Provider Temporarily Unavailable' : 'AI Interpretation Issue'}
                                </h2>
                                <p className="text-slate-600 text-sm mb-2 leading-relaxed text-left">{error}</p>
                                <p className="text-slate-400 text-xs mb-6 leading-relaxed">The backup profile shown below uses simplified logic only and is not analytically meaningful. You can dismiss this notice and review the backup result, or try again — possibly in a few minutes.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowErrorDialog(false)} className="flex-1 bg-slate-800 text-white font-bold py-3 rounded-xl text-sm">VIEW BACKUP RESULT</button>
                                    <button onClick={() => { setError(null); setErrorIsExternal(false); setShowErrorDialog(false); setInterpretedIntent(null); setIsMockMode(false); }} className="flex-1 bg-white border border-slate-300 text-slate-600 font-bold py-3 rounded-xl text-sm">TRY AGAIN</button>
                                </div>
                            </div>
                        </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
