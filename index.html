<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montgomery Business Companion Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
    <style>
        #map { height: 100vh; width: 100%; background: #f1f5f9; }
        .custom-popup .leaflet-popup-content-wrapper { 
            background: white !important; 
            border: none !important; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
            border-radius: 16px !important; 
            padding: 0 !important;
            overflow: hidden !important;
        }
        .custom-popup .leaflet-popup-content {
            margin: 0 !important;
            width: 280px !important;
        }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Details/Summary styling */
        details summary::-webkit-details-marker { display: none; }
        details summary { list-style: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased">
    <div id="root"></div>

    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js" crossorigin="anonymous"></script>
    
    <!-- Leaflet and Turf -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js" crossorigin="anonymous"></script>

    <!-- Gemini SDK via CDN -->
    <script type="module" crossorigin="anonymous" data-ignore="true">
        import('https://esm.sh/@google/genai@2.9.0').then(mod => {
            window.GoogleGenAI = mod.GoogleGenAI;
            console.log("Gemini SDK Loaded Successfully");
        }).catch(err => {
            console.error("Failed to load Gemini SDK from ESM.sh", err);
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Global Error Handler for diagnostics
        window.onerror = function(message, source, lineno, colno, error) {
            console.error("Global Script Error:", {message, source, lineno, colno, error});
            if (message === "Script error.") {
                console.error("A cross-origin script error occurred. This is often due to CDN issues or blocked resources.");
            }
        };

        // API Key
        const CENSUS_API_KEY = "c113b395a568d62a02db2a565e8e600f5e1ae9f1";

        function App() {
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [errorIsExternal, setErrorIsExternal] = useState(false);
            const [showErrorDialog, setShowErrorDialog] = useState(false);
            const [uiMode, setUiMode] = useState('intent'); // Defaults to intent for prototype focus
            const [geminiApiKey, setGeminiApiKey] = useState('');
			const [apiKeySubmitted, setApiKeySubmitted] = useState(false);
			const [selectedTract, setSelectedTract] = useState(null);
            const [cityData, setCityData] = useState(null);
            const [geoJsonData, setGeoJsonData] = useState(null);
            const [viewMode, setViewMode] = useState('opportunity');
            
            // New Montgomery Biz Intent State
            const [businessFamilies, setBusinessFamilies] = useState([]);
            const [mappingConfig, setMappingConfig] = useState(null);
            const [advancedConfig, setAdvancedConfig] = useState(null);
            const [interpreterSchema, setInterpreterSchema] = useState(null);
            const [investorDescription, setInvestorDescription] = useState("");
            const [investorPriorities, setInvestorPriorities] = useState("");
            const [clarificationResponse, setClarificationResponse] = useState("");
            const [interpretedIntent, setInterpretedIntent] = useState(null);
            const [isInterpreting, setIsInterpreting] = useState(false);
			const [keyConfirmed, setKeyConfirmed] = useState(false);
			const [topMatches, setTopMatches] = useState([]);
			
			const [schemaOpen, setSchemaOpen] = useState(false);
			const [isMockMode, setIsMockMode] = useState(false);

            const viewModeRef = useRef(viewMode);
			const showTractOnMap = (geoid) => {
				if (!geoJsonData) return;
				const tractFeature = geoJsonData.features.find(f => f.properties.GEOID === geoid);
				if (!tractFeature) return;
				setSelectedTract(tractFeature.properties);
				setUiMode('map');
				setTimeout(() => {
					if (geoJsonLayerRef.current && mapRef.current) {
						geoJsonLayerRef.current.eachLayer((layer) => {
							if (layer.feature && layer.feature.properties.GEOID === geoid) {
								const bounds = layer.getBounds();
								mapRef.current.setView(bounds.getCenter(), 13);
								layer.openPopup();
							}
						});
					}
				}, 150);
			};
			const confirmApiKey = async () => {
				if (!geminiApiKey.trim()) return;
				try {
					if (!window.GoogleGenAI) throw new Error("SDK not ready");
					const ai = new window.GoogleGenAI({ apiKey: geminiApiKey.trim() });
					await ai.models.generateContent({
						model: "gemini-2.0-flash",
						contents: [{ parts: [{ text: "reply only: ok" }] }]
					});
					setKeyConfirmed(true);
					setApiKeySubmitted(true);
					setIsMockMode(false);
				} catch(err) {
					setKeyConfirmed(false);
					const msg = err.message || '';
					if (msg.includes('503') || msg.includes('UNAVAILABLE') || msg.includes('high demand')) {
						alert("The Gemini model is temporarily busy (high demand). Your key is likely valid — please wait a minute and try confirming again.");
					} else if (msg.includes('400') || msg.includes('API_KEY') || msg.includes('invalid')) {
						alert("Key not recognised. Please check that you have copied the full API key from Google AI Studio and try again.");
					} else {
						alert("Could not reach the Gemini service. Please check your internet connection and try again.");
					}
				}
			};
            const mapRef = useRef(null);
            const geoJsonLayerRef = useRef(null);

            useEffect(() => {
                // --- business_families.json + cluster patch ---
                Promise.all([
                    fetch('/business_families.json').then(r => r.json()),
                    fetch('/business_families_cluster_patch.json').then(r => r.json())
                        .catch(() => { console.warn('Cluster patch not found — running without it'); return null; })
                ]).then(([base, patch]) => {
                    if (!patch || !Array.isArray(patch.patches)) {
                        setBusinessFamilies(base || []);
                        return;
                    }
                    const patchById = Object.fromEntries(patch.patches.map(p => [p.id, p]));
                    const merged = (base || []).map(fam => {
                        const p = patchById[fam.id];
                        if (!p) return fam;
                        const out = { ...fam };
                        if (p.target_customer_origin && !out.target_customer_origin)
                            out.target_customer_origin = p.target_customer_origin;
                        if (p.cluster_affinity && !out.cluster_affinity)
                            out.cluster_affinity = p.cluster_affinity;
                        if (p.cluster_affinity_notes && !out.cluster_affinity_notes)
                            out.cluster_affinity_notes = p.cluster_affinity_notes;
                        return out;
                    });
                    setBusinessFamilies(merged);
                }).catch(err => console.error('Could not load families', err));

                // --- business_need_mapping.json + needs patch ---
                Promise.all([
                    fetch('/business_need_mapping.json').then(r => r.json()),
                    fetch('/business_need_mapping_patch.json').then(r => r.json())
                        .catch(() => { console.warn('Need mapping patch not found — running without it'); return null; })
                ]).then(([base, patch]) => {
                    if (!patch) { setMappingConfig(base); return; }
                    const merged = { ...base };
                    merged.supported_business_needs = [
                        ...(base.supported_business_needs || []),
                        ...(patch.new_supported_business_needs || [])
                    ];
                    merged.supported_tract_indicators = [
                        ...(base.supported_tract_indicators || []),
                        ...(patch.new_supported_tract_indicators || [])
                    ];
                    merged.business_need_to_tract_mapping_v1 = {
                        ...(base.business_need_to_tract_mapping_v1 || {}),
                        ...(patch.new_business_need_to_tract_mapping || {})
                    };
                    if (patch.interaction_rules) merged._patch_interaction_rules = patch.interaction_rules;
                    if (patch.ui_transparency_recommendations) merged._patch_ui_hints = patch.ui_transparency_recommendations;
                    setMappingConfig(merged);
                }).catch(err => console.error('Could not load mapping config', err));

                // --- advanced_indicator_seed (no patch) ---
                fetch('/advanced_indicator_seed_v1.json')
                    .then(r => r.json())
                    .then(data => setAdvancedConfig(data))
                    .catch(err => console.error('Could not load advanced config', err));

                // --- interpreter_output_schema.json + schema patch ---
                Promise.all([
                    fetch('/interpreter_output_schema.json').then(r => r.json()),
                    fetch('/interpreter_output_schema_patch.json').then(r => r.json())
                        .catch(() => { console.warn('Schema patch not found — running without it'); return null; })
                ]).then(([base, patch]) => {
                    if (!patch) { setInterpreterSchema(base); return; }
                    const merged = JSON.parse(JSON.stringify(base)); // deep clone
                    // 1. Add target_customer_origin to output_template
                    if (patch.output_template_additions && patch.output_template_additions.target_customer_origin) {
                        merged.output_template.target_customer_origin = [];
                        if (!merged.required_fields.includes('target_customer_origin'))
                            merged.required_fields.push('target_customer_origin');
                    }
                    // 2. Add enum values
                    if (patch.enum_additions && patch.enum_additions.target_customer_origin_values) {
                        merged.enums = merged.enums || {};
                        merged.enums.target_customer_origin_values = patch.enum_additions.target_customer_origin_values;
                    }
                    // 3. Add three new location_needs fields
                    if (patch.location_needs_additions && patch.location_needs_additions.new_fields) {
                        const newFields = patch.location_needs_additions.new_fields;
                        Object.entries(newFields).forEach(([key, def]) => {
                            const defVal = typeof def.default === 'number' ? def.default : 0.0;
                            merged.output_template.location_needs[key] = defVal;
                            const path = `location_needs.${key}`;
                            if (!merged.numeric_field_policy.applies_to.includes(path))
                                merged.numeric_field_policy.applies_to.push(path);
                        });
                    }
                    // 4. Carry activation rules for prompt construction
                    if (patch.interpreter_activation_rules)
                        merged._patch_activation_rules = patch.interpreter_activation_rules;
                    if (patch.location_needs_additions)
                        merged._patch_location_needs_meta = patch.location_needs_additions;
                    setInterpreterSchema(merged);
                }).catch(err => console.error('Could not load interpreter schema', err));
            }, []);

            useEffect(() => {
                viewModeRef.current = viewMode;
            }, [viewMode]);

            useEffect(() => {
                if (uiMode === 'map' && mapRef.current) {
                    mapRef.current.invalidateSize();
                }
            }, [uiMode]);

            const runInterpreter = async () => {
                if (!investorDescription.trim()) return;
                
                setIsInterpreting(true);
                setInterpretedIntent(null);
                
                try {
                    if (!window.GoogleGenAI) {
                        throw new Error("Gemini SDK not properly initialized.");
                    }

                    // The source of truth for "do we have a usable key" is keyConfirmed,
                    // set only after a real successful validation call to Gemini. We do NOT
                    // rely on the raw textbox alone: its content can be cleared or edited
                    // after confirmation without keyConfirmed changing, and that mismatch
                    // previously sent the app into mock mode even when a valid, already
                    // confirmed key existed in memory.
					if (!keyConfirmed || !geminiApiKey.trim()) {
						console.warn("No confirmed API key available. Falling back to mock.");
                        // Wait slightly to feel "interpretive"
						await new Promise(resolve => setTimeout(resolve, 800));
						runMockLogic();
						return;
					}
					const apiKey = geminiApiKey.trim();
					setApiKeySubmitted(true);

                    const ai = new window.GoogleGenAI({ apiKey });
                    
                    const systemInstruction = `
You are the AI Interpreter for Montgomery Biz Intent.

Your role is to translate an investor’s natural-language business idea into a structured business profile for a deterministic analytical engine.

You are NOT the final judge.
You do NOT decide:
* legal compliance
* zoning validity
* permit status
* final recommendation
* final tract ranking

You only translate the business idea into structured product logic.

## Inputs
You will receive:
* business_text: the investor’s natural-language business description
* priority_text: optional natural-language priorities
* optionally clarification_response_text: if a clarification was requested

## Reference constraints
You must use only the known business families and the known output schema.
You must NOT invent new family IDs.

REFERENCE FAMILIES:
${JSON.stringify(businessFamilies)}

OUTPUT SCHEMA:
${JSON.stringify(interpreterSchema)}

## Behavioral rules
1. Think operationally, not poetically. Focus on activity, space type, and location needs.
2. Prefer decomposition over invention. Decompose hybrid concepts into core/secondary activities.
3. Hybrid vs Contextual: Use 'secondary_family_id' to add context, but set 'detected_flags.hybrid_concept' to 'true' ONLY if the business genuinely combines two distinct operational models (e.g., a bookstore with a cafe). If the secondary family just describes a flavor or specialty (e.g., pediatric speech therapy), set 'hybrid_concept' to 'false'.
4. Be honest about uncertainty. Lower confidence if vague.
5. Ask at most one clarification question.
6. Use priority_text as business context (parking, low rent, young clientele, etc.).
7. Sensitive clientele: interpret as service-design context (privacy, calm environment), not demographic targeting.
8. Do not overclaim success or zoning availability.
9. Output JSON only. No explanations outside the JSON.

## Decision order
1. Identify dominant activity
2. Identify operating model
3. Identify space profile
4. Infer location needs
5. Identify secondary family context if needed.
6. Determine if the concept is a true "hybrid" (dual operation).
7. Assess ambiguity.
8. Produce valid structured JSON only.

## Family selection and Hybrid policy
* 'business_family_id' must be one known family ID.
* 'secondary_family_id' can be used for contextual modifiers.
* 'detected_flags.hybrid_concept' = 'true' only for dual-nature operations (e.g., Bike shop + Repair workshop).
* 'detected_flags.hybrid_concept' = 'false' for specialized but single-mode concepts (e.g., Adult Day Care, Pediatric Dental).
* if too unclear, use 'emerging_or_hard_to_classify'.

## Confidence policy
* 0.80–1.00 = clear concept
* 0.60–0.79 = mostly clear
* 0.40–0.59 = hybrid or partly unclear
* below 0.40 = weak understanding

## Ambiguity policy
* low = clearly mappable
* medium = hybrid but still interpretable
* high = materially unclear or underdefined

## Numeric rules
All numeric values in location_needs, activity_profile, and confidence must remain in the range 0.0 to 1.0.

## Extended output fields (schema patch v1.1 — required)
You must also produce these fields in addition to the base schema:

target_customer_origin: array of {origin, weight} objects. Allowed origins: resident, daytime_worker, destination_visitor, passing_traffic. Weights must sum to 1.0. Use the matched family's default mix as a starting point and adjust for the specific business description.

location_needs.luxury_cluster_fit (0.0–1.0): Set to 0.0 unless the description or priority_text signals premium/upscale/luxury/boutique/high-end/artisan positioning, in which case 0.6–0.95. This is independent of affluent_area — do not conflate them.

location_needs.compatible_business_cluster (0.0–1.0): Default 0.5 for most families. Raise to 0.7–0.9 for cluster-dependent concepts (restaurant rows, wellness districts, professional hubs, luxury retail). Lower to 0.2–0.3 for logistics or back-office operations.

location_needs.daytime_worker_concentration (0.0–1.0): Mandatory minimum 0.6 for food_beverage_quickservice, professional_office_service, and digital_creative_studio. For other families, set to approximately 0.4 + (0.4 × daytime_worker weight from target_customer_origin). Set to 0.0 only if daytime_worker weight is below 0.15.

Add a note to interpretation_notes for each of these three fields explaining why the value was set as it was.
`;

                    const userPrompt = `
business_text: "${investorDescription}"
priority_text: "${investorPriorities || 'none'}"
${clarificationResponse ? `clarification_response_text: "${clarificationResponse}"` : ''}
`;

                    const response = await ai.models.generateContent({
                        model: "gemini-2.0-flash",
                        contents: [{ parts: [{ text: userPrompt }] }],
                        config: {
                            systemInstruction: systemInstruction,
                            responseMimeType: "application/json",
                        }
                    });

                    if (!response.text) throw new Error("Empty response from AI");
                    
                    const result = JSON.parse(response.text);

                    // --- Validation Gate ---
                    const validateResult = (data) => {
                        const validFamilies = businessFamilies.map(f => f.id);
                        const validZoningFamilies = Array.from(new Set(
                            businessFamilies.flatMap(f => f.likely_zoning_families || [])
                        ));
                        
                        const requiredFields = [
                            "business_text", "canonical_label", "business_family_id", 
                            "customer_mode", "space_profile", "location_needs", 
                            "activity_profile", "detected_flags", "confidence", 
                            "ambiguity_level", "needs_confirmation", "interpretation_notes",
                            "zoning_candidate_families", "reasoning_summary"
                        ];

                        // 1. Structural Presence Checks
                        for (const field of requiredFields) {
                            if (data[field] === undefined) return { valid: false, reason: `Missing field: ${field}` };
                        }
                        if (!("priority_text" in data)) return { valid: false, reason: "Missing field: priority_text" };
                        if (!("secondary_family_id" in data)) return { valid: false, reason: "Missing field: secondary_family_id" };
                        if (!("clarification_question" in data)) return { valid: false, reason: "Missing field: clarification_question" };

                        // 2. Business Families
                        if (typeof data.business_family_id !== 'string' || !validFamilies.includes(data.business_family_id)) {
                            return { valid: false, reason: `Invalid business_family_id: ${data.business_family_id}` };
                        }
                        
                        // Strict check for secondary_family_id
                        if (data.secondary_family_id !== null && typeof data.secondary_family_id !== 'string') {
                            return { valid: false, reason: "secondary_family_id must be string or null" };
                        }
                        if (data.secondary_family_id && !validFamilies.includes(data.secondary_family_id)) {
                            return { valid: false, reason: `Invalid secondary_family_id: ${data.secondary_family_id}` };
                        }

                        // 3. Zoning Candidate Families
                        if (!Array.isArray(data.zoning_candidate_families)) {
                            return { valid: false, reason: "zoning_candidate_families must be an array" };
                        }
                        for (const z of data.zoning_candidate_families) {
                            if (typeof z !== 'string' || !validZoningFamilies.includes(z)) {
                                return { valid: false, reason: `Invalid zoning candidate family: ${z}` };
                            }
                        }

                        // 4. Enums
                        const validCustomerModes = ["walk_in", "appointment", "delivery", "backoffice", "hybrid"];
                        const validSpaceProfiles = ["storefront", "small_retail_unit", "restaurant_unit", "office", "clinic_like", "studio", "workshop", "warehouse", "flex_storefront", "unknown"];
                        const validAmbiguityLevels = ["low", "medium", "high"];

                        if (!validCustomerModes.includes(data.customer_mode)) return { valid: false, reason: `Invalid customer_mode: ${data.customer_mode}` };
                        if (!validSpaceProfiles.includes(data.space_profile)) return { valid: false, reason: `Invalid space_profile: ${data.space_profile}` };
                        if (!validAmbiguityLevels.includes(data.ambiguity_level)) return { valid: false, reason: `Invalid ambiguity_level: ${data.ambiguity_level}` };

                        // 5. Numeric Ranges (0.0 - 1.0)
                        const checkRange = (val) => typeof val === 'number' && !isNaN(val) && val >= 0 && val <= 1;
                        
                        if (!checkRange(data.confidence)) return { valid: false, reason: `Invalid confidence range: ${data.confidence}` };
                        
                        const locValues = Object.values(data.location_needs);
                        if (locValues.length === 0) return { valid: false, reason: "location_needs must not be empty" };
                        for (const val of locValues) {
                            if (!checkRange(val)) return { valid: false, reason: `Invalid location_needs value: ${val}` };
                        }
                        
                        const actValues = Object.values(data.activity_profile);
                        if (actValues.length === 0) return { valid: false, reason: "activity_profile must not be empty" };
                        for (const val of actValues) {
                            if (!checkRange(val)) return { valid: false, reason: `Invalid activity_profile value: ${val}` };
                        }

                        // 6. Booleans and Clarification Logic
                        if (typeof data.needs_confirmation !== 'boolean') return { valid: false, reason: "needs_confirmation must be boolean" };
                        if (data.clarification_question !== null && typeof data.clarification_question !== 'string') {
                            return { valid: false, reason: "clarification_question must be string or null" };
                        }

                        if (data.needs_confirmation === false && data.clarification_question !== null) {
                            // Minor correction: if no confirmation needed, clear the question
                            data.clarification_question = null;
                        }

                        // 7. Arrays and Flags
                        if (!Array.isArray(data.interpretation_notes)) return { valid: false, reason: "interpretation_notes must be an array" };
                        if (data.interpretation_notes.some(n => typeof n !== 'string')) return { valid: false, reason: "interpretation_notes must contain strings only" };

                        if (typeof data.detected_flags !== 'object' || data.detected_flags === null) return { valid: false, reason: "detected_flags must be an object" };
                        for (const val of Object.values(data.detected_flags)) {
                            if (typeof val !== 'boolean') return { valid: false, reason: "detected_flags must contain booleans only" };
                        }

                        return { valid: true };
                    };

                    const validation = validateResult(result);
                    if (!validation.valid) {
                        console.warn("AI result failed validation:", validation.reason);
                        throw new Error(`Validation Error: ${validation.reason}`);
                    }

                    setIsMockMode(false);
					result.generated_at = new Date().toISOString();
					setInterpretedIntent(result);

                } catch (err) {
                    console.error("Gemini Interpretation Failed", err);
                    const msg = err.message || '';
                    let reason;
                    let isExternalCause;
                    if (msg.includes('503') || msg.includes('UNAVAILABLE') || msg.includes('high demand')) {
                        reason = "The Gemini AI service is temporarily overloaded on Google's side (error 503, high demand). This is not a fault in this application — it is a transient capacity issue on the AI provider's end, and usually resolves within minutes. Your business description below was processed instead by simplified backup logic, which has no real analytical value.";
                        isExternalCause = true;
                    } else if (msg.includes('400') || msg.includes('API_KEY') || msg.includes('invalid')) {
                        reason = "The Gemini API key was rejected. Please check that a valid key is entered. Your business description below was processed instead by simplified backup logic, which has no real analytical value.";
                        isExternalCause = false;
                    } else if (msg.startsWith('Validation Error')) {
                        reason = "The AI Interpreter responded, but its output did not pass this application's structural validation checks (" + msg.replace('Validation Error: ', '') + "). This is a safeguard, not a crash — malformed AI output is never allowed to reach the scoring engine. Your business description below was processed instead by simplified backup logic, which has no real analytical value.";
                        isExternalCause = false;
                    } else if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('network')) {
                        reason = "A network connection to the Gemini API could not be established. This may be a temporary connectivity issue. Your business description below was processed instead by simplified backup logic, which has no real analytical value.";
                        isExternalCause = true;
                    } else {
                        reason = "The AI Interpreter could not complete this request (" + (msg || 'unknown error') + "). Your business description below was processed instead by simplified backup logic, which has no real analytical value.";
                        isExternalCause = false;
                    }
                    setError(reason);
                    setShowErrorDialog(true);
                    setErrorIsExternal(isExternalCause);
                    runMockLogic();
                } finally {
                    setIsInterpreting(false);
                }
            };

            const runMockLogic = () => {
				setIsMockMode(true);
                const input = investorDescription.toLowerCase();
                const priosText = investorPriorities.toLowerCase();
                    
                let family_id = "emerging_or_hard_to_classify";
                let secondary_id = null;
                let confidence = 0.85;
                let label = "General Business (Mock)";
                let reasoning = "Mapped via fallback keywords.";
                let customer_mode = "walk_in";
                let space_profile = "storefront";
                let notes = ["Mock interpretation applied as fallback."];
                    
                const flags = {
                    alcohol_sensitive: false,
                    child_sensitive: false,
                    medical_sensitive: false,
                    industrial_sensitive: false,
                    hybrid_concept: false
                };

                const location_needs = {
                    visibility: 0.5, footfall: 0.5, parking: 0.5, transit: 0.5,
                    affluent_area: 0.0, family_area: 0.0, nightlife_area: 0.0,
                    low_rent_priority: 0.0, vehicle_access: 0.0,
                    // Patch fields — generic mock defaults (no analytical value)
                    luxury_cluster_fit: 0.0,
                    compatible_business_cluster: 0.5,
                    daytime_worker_concentration: 0.0
                };

                const activity_profile = {
                    daytime: 0.9, evening: 0.1, noise_tolerance_needed: 0.1, delivery_logistics: 0.1
                };

                // Minimal mock logic for essential families
                if (input.includes("coffee") || input.includes("cafe")) {
                    family_id = "food_beverage_sitdown";
                    label = "Cafe (Mock)";
                } else if (input.includes("burger") || input.includes("fast food")) {
                    family_id = "food_beverage_quickservice";
                    label = "Quick Service (Mock)";
                } else if (input.includes("dentist") || input.includes("clinic")) {
                    family_id = "health_medical_therapy";
                    label = "Medical (Mock)";
                } else if (input.includes("shop") || input.includes("retail")) {
                    family_id = "retail_storefront";
                    label = "Retail (Mock)";
                }

                const result = {
                    business_text: investorDescription,
                    priority_text: investorPriorities || null,
                    canonical_label: label,
                    business_family_id: family_id,
                    secondary_family_id: secondary_id,
                    reasoning_summary: reasoning,
                    customer_mode: customer_mode,
                    space_profile: space_profile,
                    location_needs: location_needs,
                    activity_profile: activity_profile,
                    // Patch field — balanced default, no analytical value in mock mode
                    target_customer_origin: [
                        { origin: "resident",            weight: 0.35 },
                        { origin: "passing_traffic",     weight: 0.30 },
                        { origin: "daytime_worker",      weight: 0.20 },
                        { origin: "destination_visitor", weight: 0.15 }
                    ],
                    zoning_candidate_families: ["commercial"],
                    detected_flags: flags,
                    confidence: confidence,
                    ambiguity_level: "low",
                    needs_confirmation: false,
                    clarification_question: null,
                    interpretation_notes: notes
                };
                result.generated_at = new Date().toISOString();
                setInterpretedIntent(result);
            };

            const normalize = (val, min, max) => (max === min) ? 0 : (val - min) / (max - min);

            const buildTractIndicatorProfile = (p, ctx) => {
                const nArea = normalize(p.area || 0, ctx.minArea, ctx.maxArea);
                const nAge = normalize(p.age || 0, ctx.minAge, ctx.maxAge);
                
                const profile = {
                    demand_score: parseFloat(p.demandScore) || 0,
                    business_density: p.normBizDensity || 0,
                    relative_business_presence: p.normBizDensity || 0,
                    median_income: p.normInc || 0,
                    median_age: nAge,
                    transit_access: parseFloat(p.transitAccessScore) || 0,
                    parking_proxy: 1 - (p.normBizDensity || 0),
                    vehicle_access_proxy: ((1 - (p.normBizDensity || 0)) * 0.7 + nArea * 0.3),
                    family_proxy: (1 - Math.abs(nAge - 0.45)),
                    nightlife_proxy: ((p.normBizDensity || 0) * 0.6 + (parseFloat(p.transitAccessScore) || 0) * 0.4),
                    commercial_activity_proxy: ((p.normBizDensity || 0) * 0.7 + (parseFloat(p.demandScore) || 0) * 0.3),
                    low_cost_proxy: 1 - (p.normInc || 0)
                };

                // Add advanced indicators from advanced_indicator_seed_v1.json if formula is provided
                profile.after_work_leisure_proxy = (
                    0.35 * profile.nightlife_proxy + 
                    0.25 * profile.transit_access + 
                    0.25 * profile.commercial_activity_proxy + 
                    0.15 * profile.parking_proxy
                );
                
                return profile;
            };

            const computeTractFit = (intent, indicators, mapping) => {
                if (!intent || !indicators || !mapping) return null;
                
                const needsMapping = mapping.business_need_to_tract_mapping_v1;
                const weights = mapping.global_weights;
                const pWeight = weights.primary_match_weight || 1.0;
                const sWeight = weights.secondary_match_weight || 0.5;
                
                const contributions = {};
                let totalWeightedFit = 0;
                let totalNeedMagnitude = 0;
                
                // Advanced scoring helper data
                const directFields = ['demand_score', 'business_density', 'median_income', 'median_age', 'transit_access'];
                
                // For indicator_coverage_ratio
                const allExpectedIndicators = new Set();
                const availableExpectedIndicators = new Set();
                
                let usedDirectCount = 0;
                let totalIndicatorCount = 0;
                let coveredNeedWeight = 0;

                mapping.supported_business_needs.forEach(needKey => {
                    const needImportance = intent.location_needs[needKey] || 0;
                    if (needImportance === 0) return;
                    
                    const map = needsMapping[needKey];
                    if (!map) {
                        // Need interpreted but no mapping exists in config
                        coveredNeedWeight += needImportance * 0.3; // weak_or_incomplete_support tier
                        return;
                    }
                    
                    let weightedIndicatorSum = 0;
                    let divisor = 0;
                    let hasDirect = false;
                    let hasProxy = false;
                    
                    const primary = map.primary_matches || [];
                    const secondary = map.secondary_matches || [];
                    
                    primary.forEach(ind => {
                        allExpectedIndicators.add(ind);
                        if (indicators.hasOwnProperty(ind)) {
                            availableExpectedIndicators.add(ind);
                            const val = indicators[ind] || 0;
                            weightedIndicatorSum += val * pWeight;
                            divisor += pWeight;
                            totalIndicatorCount++;
                            if (directFields.includes(ind)) {
                                usedDirectCount++;
                                hasDirect = true;
                            } else {
                                hasProxy = true;
                            }
                        }
                    });
                    
                    secondary.forEach(ind => {
                        allExpectedIndicators.add(ind);
                        if (indicators.hasOwnProperty(ind)) {
                            availableExpectedIndicators.add(ind);
                            const val = indicators[ind] || 0;
                            weightedIndicatorSum += val * sWeight;
                            divisor += sWeight;
                            totalIndicatorCount++;
                            if (directFields.includes(ind)) {
                                usedDirectCount++;
                                hasDirect = true;
                            } else {
                                hasProxy = true;
                            }
                        }
                    });
                    
                    const needFit = divisor > 0 ? (weightedIndicatorSum / divisor) : 0;
                    const contribution = needFit * needImportance;
                    
                    // Support level logic per authoritative config
                    // full (1.0), proxy_only (0.6), weak (0.3)
                    const supportLevel = hasDirect ? 1.0 : (hasProxy ? 0.6 : 0.3);
                    coveredNeedWeight += needImportance * supportLevel;

                    contributions[needKey] = {
                        score: parseFloat(needFit.toFixed(3)),
                        contribution: parseFloat(contribution.toFixed(3)),
                        impact: needImportance,
                        notes: map.notes
                    };
                    
                    totalWeightedFit += contribution;
                    totalNeedMagnitude += needImportance;
                });
                
                const finalScore = totalNeedMagnitude > 0 ? (totalWeightedFit / totalNeedMagnitude) : 0;
                
                const activeContributions = Object.entries(contributions)
                    .sort(([,a], [,b]) => b.contribution - a.contribution);
                
                // Advanced Transparency Scores based on advanced_indicator_seed_v1.json
                const directDataRatio = totalIndicatorCount > 0 ? (usedDirectCount / totalIndicatorCount) : 0;
                const indicatorCoverageRatio = allExpectedIndicators.size > 0 
                    ? (availableExpectedIndicators.size / allExpectedIndicators.size) 
                    : 1.0;
                    
                const ambiguityMap = { low: 1.0, medium: 0.7, high: 0.4 };
                const businessModelClarity = ambiguityMap[intent.ambiguity_level] || 0.7;

                const proxyConfidenceScore = (0.6 * directDataRatio + 0.25 * indicatorCoverageRatio + 0.15 * businessModelClarity);
                const dataCompletenessScore = totalNeedMagnitude > 0 ? (coveredNeedWeight / totalNeedMagnitude) : 0;

                return {
                    total_fit_score: parseFloat(finalScore.toFixed(3)),
                    per_need_contributions: contributions,
                    proxy_confidence_score: parseFloat(proxyConfidenceScore.toFixed(3)),
                    data_completeness_score: parseFloat(dataCompletenessScore.toFixed(3)),
                    strongest_matches: activeContributions.slice(0, 2).map(([k]) => k.replace(/_/g, ' ')),
                    weak_matches: [...activeContributions].reverse().slice(0, 2).filter(([k, v]) => v.score < 0.4).map(([k]) => k.replace(/_/g, ' ')),
                    explanatory_notes: activeContributions.length > 0 
                        ? `Primary fit driven by ${activeContributions[0][0].replace(/_/g, ' ')} alignment.` 
                        : "Baseline alignment detected."
                };
            };

            const getColor = (val, mode) => {
                const numVal = typeof val === 'string' ? parseFloat(val) : val;
                if (mode === 'income') {
                    return numVal > 80000 ? '#065f46' : numVal > 60000 ? '#059669' : numVal > 40000 ? '#34d399' : numVal > 20000 ? '#a7f3d0' : '#ecfdf5';
                }
                return numVal > 0.8 ? '#5b21b6' : numVal > 0.6 ? '#7c3aed' : numVal > 0.4 ? '#a78bfa' : numVal > 0.2 ? '#ddd6fe' : '#f5f3ff';
            };

            const fetchBizData = async () => {
                const baseUrl = "https://gis.montgomeryal.gov/server/rest/services/HostedDatasets/Business_License/MapServer/0/query";
                const queryParams = "where=1%3D1&outFields=OBJECTID,Id,custCOMPANY_NAME,scCODE,scNAME,Full_Address&returnGeometry=true&outSR=4326&f=json&orderByFields=OBJECTID";
                
                let offset = 0;
                const pageSize = 1000;
                let allFeatures = [];
                let hasMore = true;

                while (hasMore) {
                    let data = null;
                    let attempt = 0;
                    while (attempt < 3 && !data) {
                        attempt++;
                        try {
                            console.log(`[Business Data] ATTEMPT offset=${offset}, Try=${attempt}`);
                            const queryUrl = `${baseUrl}?${queryParams}&resultOffset=${offset}&resultRecordCount=${pageSize}`;
                            const response = await fetch(queryUrl).then(r => {
                                console.log(`[Business Data] URL: ${queryUrl.split('?')[0]}, Success: ${r.ok}, Status: ${r.status}, Content-Type: ${r.headers.get('content-type')}`);
                                return r;
                            });
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);

                            if (offset === 14000) {
                                try {
                                    const rawText = await response.text();
                                    console.log(`[Diagnostic] Offset 14000 body preview (300 chars): ${rawText.substring(0, 300)}`);
                                    data = JSON.parse(rawText);
                                } catch (err) {
                                    console.error(`[Diagnostic] Offset 14000 read/parse FAIL: ${err.message}`);
                                    throw err;
                                }
                            } else {
                                data = await response.json();
                            }
                        } catch (e) {
                            console.error(`[Business Data] FAIL at offset=${offset}, Try=${attempt}, Error: ${e.message}`);
                            if (attempt < 3) {
                                const backoff = attempt * 500;
                                console.log(`[Business Data] Retrying in ${backoff}ms...`);
                                await new Promise(r => setTimeout(r, backoff));
                            } else {
                                throw e;
                            }
                        }
                    }

                    if (data && !data.features) {
                        console.warn(`[Diagnostic] Offset ${offset} missing 'features'. Keys: ${Object.keys(data).join(', ')}`);
                    }
                    console.log(`[Business Data] PARSED offset=${offset}, Count=${data.features?.length || 0}`);

                    if (data.features && data.features.length > 0) {
                        const geoJsonFeatures = data.features
                            .filter(f => f.geometry && typeof f.geometry.x === 'number')
                            .map(f => ({
                                type: "Feature",
                                geometry: { type: "Point", coordinates: [f.geometry.x, f.geometry.y] },
                                properties: f.attributes
                            }));
                        allFeatures = allFeatures.concat(geoJsonFeatures);
                        if (data.features.length < pageSize) hasMore = false;
                        else offset += pageSize;
                    } else {
                        hasMore = false;
                    }
                }
                return { type: "FeatureCollection", features: allFeatures };
            };

            const fetchAndProcessData = async () => {
                try {
                    console.log(">>> STAGE: START fetchAndProcessData");
                    setLoading(true);
                    
                    // 1. Fetch ACS
                    let acsJson;
                    try {
                        console.log(">>> STAGE: BEFORE ACS fetch");
                        const acsUrl = `https://api.census.gov/data/2022/acs/acs5?get=NAME,B19013_001E,B01002_001E,B01003_001E,B15003_001E,B15003_022E&for=tract:*&in=state:01&in=county:101&key=${CENSUS_API_KEY}`;
                        const acsRes = await fetch(acsUrl).then(r => {
                            console.log(`[Census ACS] Success: ${r.ok}, Status: ${r.status}`);
                            return r;
                        }).catch(e => {
                            console.error(`[Census ACS] FAIL, Error: ${e.message}`);
                            throw e;
                        });
                        if (!acsRes.ok) throw new Error("Census API failed");
                        acsJson = await acsRes.json();
                        console.log(">>> STAGE: AFTER ACS parse");
                    } catch (e) {
                        console.error("[PHASE FAIL] Census ACS", e);
                        throw e;
                    }

                    // 2. Fetch TIGER
                    let tigerGeo;
                    try {
                        console.log(">>> STAGE: BEFORE TIGER fetch");
                        const tigerUrl = `https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Tracts_Blocks/MapServer/4/query?where=STATE%3D'01'%20AND%20COUNTY%3D'101'&outFields=GEOID,TRACT&returnGeometry=true&outSR=4326&f=geojson`;
                        const tigerRes = await fetch(tigerUrl).then(r => {
                            console.log(`[TIGER Geo] Success: ${r.ok}, Status: ${r.status}`);
                            return r;
                        }).catch(e => {
                            console.error(`[TIGER Geo] FAIL, Error: ${e.message}`);
                            throw e;
                        });
                        if (!tigerRes.ok) throw new Error("TIGER geometry fetch failed");
                        tigerGeo = await tigerRes.json();
                        console.log(">>> STAGE: AFTER TIGER parse");
                    } catch (e) {
                        console.error("[PHASE FAIL] TIGER Geometry", e);
                        throw e;
                    }

                    // 3. Fetch Business Data (Paginated)
                    let bizGeo;
                    try {
                        console.log(">>> STAGE: BEFORE fetchBizData call");
                        bizGeo = await fetchBizData();
                        console.log(">>> STAGE: AFTER fetchBizData returns");
                    } catch (e) {
                        console.error("[PHASE FAIL] Business Data Loop", e);
                        throw e;
                    }

                    // 3.5 Fetch and Parse Transit Data
                    let stopsText, serviceText;
                    try {
                        console.log(">>> STAGE: BEFORE stops.csv fetch");
                        const stopsRes = await fetch('stops.csv').then(r => {
                            console.log(`[Local stops.csv] Success: ${r.ok}, Status: ${r.status}`);
                            return r;
                        }).catch(e => {
                            console.error(`[Local stops.csv] FAIL, Error: ${e.message}`);
                            throw e;
                        });
                        stopsText = await stopsRes.text();
                        console.log(">>> STAGE: AFTER stops.csv parse");

                        console.log(">>> STAGE: BEFORE stop_service.csv fetch");
                        const serviceRes = await fetch('stop_service.csv').then(r => {
                            console.log(`[Local stop_service.csv] Success: ${r.ok}, Status: ${r.status}`);
                            return r;
                        }).catch(e => {
                            console.error(`[Local stop_service.csv] FAIL, Error: ${e.message}`);
                            throw e;
                        });
                        serviceText = await serviceRes.text();
                        console.log(">>> STAGE: AFTER stop_service.csv parse");
                    } catch (e) {
                        console.error("[PHASE FAIL] Local CSV Sequential", e);
                        throw e;
                    }
                    
                    const serviceMap = new Map();
                    serviceText.split('\n').slice(1).forEach(line => {
                        const [id, count] = line.split(',');
                        if (id) serviceMap.set(id.trim(), parseFloat(count) || 0);
                    });

                    const stopsLines = stopsText.split('\n').slice(1).filter(l => l.trim());
                    const stopsGeo = {
                        type: "FeatureCollection",
                        features: stopsLines.map(line => {
                            const [id, name, lat, lon] = line.split(',');
                            const stopId = id.trim();
                            return {
                                type: "Feature",
                                geometry: { type: "Point", coordinates: [parseFloat(lon), parseFloat(lat)] },
                                properties: { id: stopId, name, serviceCount: serviceMap.get(stopId) || 0 }
                            };
                        })
                    };

                    // 4. Process
                    const demoMap = new Map();
                    acsJson.slice(1).forEach(r => {
                        const income = parseFloat(r[1]);
                        const age = parseFloat(r[2]);
                        const pop = parseInt(r[3]);
                        const total25 = parseFloat(r[4]);
                        const bach = parseFloat(r[5]);
                        
                        // Census uses specific negative values (e.g., -666666666) as flags for missing or suppressed data.
                        // We treat these as 0 to avoid skewing the normalization and demand scores for the entire city.
                        const validIncome = income > 0 ? income : 0;
                        const validAge = age > 0 ? age : 0;
                        const validPop = pop > 0 ? pop : 0;
                        const validTotal25 = total25 > 0 ? total25 : 0;
                        const validBach = bach > 0 ? bach : 0;

                        const bachPct = validTotal25 > 0 ? (validBach / validTotal25) * 100 : 0;
                        demoMap.set(`${r[6]}${r[7]}${r[8]}`, { 
                            income: validIncome, 
                            age: validAge, 
                            pop: validPop,
                            bachelors: bachPct
                        });
                    });

                    const rawValues = tigerGeo.features.map(f => {
                        const d = demoMap.get(f.properties.GEOID) || { income: 0, pop: 0, age: 0, bachelors: 0 };
                        const ptsInTract = turf.pointsWithinPolygon(bizGeo, f);
                        const bizCount = ptsInTract.features.length;
                        
                        const bufferedTract = turf.buffer(f, 0.1, { units: 'kilometers' });
                        const stopsInTract = turf.pointsWithinPolygon(stopsGeo, bufferedTract);
                        const transitStopsNearby = stopsInTract.features.length;
                        const transitServiceIntensity = stopsInTract.features.reduce((sum, s) => sum + (s.properties.serviceCount || 0), 0);

                        const area = turf.area(f) / 1000000;
                        const bizDensity = area > 0 ? bizCount / area : 0;
                        return { ...f.properties, ...d, bizCount, bizDensity, area, transitStopsNearby, transitServiceIntensity };
                    });

                    const incomes = rawValues.map(v => v.income).filter(v => !isNaN(v));
                    const maxIncome = Math.max(...incomes, 0);
                    const minIncome = Math.min(...incomes, 0);
                    
                    const pops = rawValues.map(v => v.pop).filter(v => !isNaN(v));
                    const maxPop = Math.max(...pops, 0);
                    const minPop = Math.min(...pops, 0);
                    
                    const densities = rawValues.map(v => v.bizDensity).filter(v => !isNaN(v));
                    const maxDens = Math.max(...densities, 0);
                    const minDens = Math.min(...densities, 0);

                    const intensities = rawValues.map(v => v.transitServiceIntensity).filter(v => !isNaN(v));
                    const maxInt = Math.max(...intensities, 0) || 1;
                    const minInt = Math.min(...intensities, 0);

                    const stopsNearby = rawValues.map(v => v.transitStopsNearby).filter(v => !isNaN(v));
                    const maxStops = Math.max(...stopsNearby, 0) || 1;
                    const minStops = Math.min(...stopsNearby, 0);

                    const ages = rawValues.map(v => v.age).filter(v => v > 0);
                    const maxAge = Math.max(...ages, 0) || 1;
                    const minAge = Math.min(...ages, 0);

                    const areas = rawValues.map(v => v.area).filter(v => v > 0);
                    const maxArea = Math.max(...areas, 0) || 1;
                    const minArea = Math.min(...areas, 0);

                    const contextData = { maxIncome, minIncome, maxPop, minPop, maxDens, minDens, maxInt, minInt, maxStops, minStops, maxAge, minAge, maxArea, minArea };

                    tigerGeo.features = tigerGeo.features.map((f, i) => {
                        const v = rawValues[i];
                        const normInc = normalize(v.income, minIncome, maxIncome);
                        const normPop = normalize(v.pop, minPop, maxPop);
                        const normDens = normalize(v.bizDensity, minDens, maxDens);
                        const normInt = normalize(v.transitServiceIntensity, minInt, maxInt);
                        const normStopsVal = normalize(v.transitStopsNearby, minStops, maxStops);
                        
                        const demand = (0.5 * normPop) + (0.5 * normInc);
                        const gap = demand * (1 - normDens);
                        const attractiveness = (0.6 * normDens) + (0.4 * demand);
                        
                        const tas = (0.4 * normStopsVal) + (0.6 * normInt);
                        const zoningCompatibility = 1.0; 
                        const readiness = (0.6 * gap) + (0.2 * normInt) + (0.2 * zoningCompatibility);

                        // Archetype Logic
                        let archetype = "Mixed / unclassified tract";
                        if (normDens > 0.6) archetype = "Saturated destination hub";
                        else if (normDens < 0.4 && demand > 0.4 && tas > 0.6) archetype = "Under-served connected tract";
                        else if (normDens < 0.4 && tas < 0.3) archetype = "Under-served suburban / low-transit";
                        else if (normDens >= 0.4 && normDens <= 0.6) archetype = "Balanced mid-tier tract";

                        f.properties = {
                            ...v,
                            normPop,
                            normInc,
                            normBizDensity: normDens,
                            normIntensity: normInt,
                            normStops: normStopsVal,
                            demandScore: demand.toFixed(3),
                            competitionGap: gap.toFixed(3),
                            opportunityScore: gap.toFixed(3),
                            attractivenessScore: attractiveness.toFixed(3),
                            zoningCompatibility: zoningCompatibility.toFixed(1),
                            businessReadinessScore: readiness.toFixed(3),
                            transitAccessScore: tas.toFixed(3),
                            archetype,
                            standardized_indicators: buildTractIndicatorProfile({ 
                                ...v, 
                                demandScore: demand.toFixed(3), 
                                transitAccessScore: tas.toFixed(3), 
                                normBizDensity: normDens, 
                                normInc: normInc 
                            }, contextData)
                        };
                        return f;
                    });

                    setCityData(contextData);
                    setGeoJsonData(tigerGeo);
                    setLoading(false);
                } catch (err) {
                    console.error(err);
                    setError(err.message);
                    setErrorIsExternal(false);
                    setShowErrorDialog(true);
                    setLoading(false);
                }
            };

            const renderMap = (data) => {
                if (!mapRef.current) return;
                if (geoJsonLayerRef.current) mapRef.current.removeLayer(geoJsonLayerRef.current);

                geoJsonLayerRef.current = L.geoJson(data, {
                    style: (f) => ({
                        fillColor: getColor(f.properties.opportunityScore, 'opportunity'),
                        weight: 1.5, color: 'white', fillOpacity: 0.8
                    }),
                    onEachFeature: (f, layer) => {
                        layer.on('click', () => setSelectedTract(f.properties));
                        layer.bindPopup(() => {
                            const p = f.properties;
                            const currentModeLabel = viewModeRef.current === 'income' ? 'Spending Power' : 'Underserved Demand';
                            
                            const techHelp = (content) => `<span class="inline-flex items-center justify-center w-3.5 h-3.5 ml-1 text-[8px] font-bold text-slate-300 border border-slate-200 rounded-full cursor-help hover:bg-slate-100 hover:text-indigo-500" title="Technical Details: ${content}">i</span>`;
                            const bizHelp = (meaning) => `title="Business Meaning: ${meaning}" class="cursor-help border-b border-dotted border-slate-300 pb-0.5"`;

                            return `
                                <div class="p-4 space-y-4">
                                    <div class="border-b border-slate-100 pb-2">
                                        <b class="text-slate-800 text-sm block">Tract ${p.TRACT}</b>
                                        <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Primary view: ${currentModeLabel}</span>
                                        <div class="mt-1 text-[10px] text-indigo-600 font-semibold italic">Tract reading: ${p.archetype}</div>
                                    </div>
                                    
                                    <div class="space-y-3">
                                        <div>
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 border-b border-slate-50 pb-1">A. Strategic Place Indicators</p>
                                            <div class="space-y-1.5 text-[11px]">
                                                <div class="flex justify-between items-center text-purple-900" ${bizHelp('Captures the unrealized potential of a place — where the city still appears able to absorb new activity by revealing remaining room for growth under the current model.')}>
                                                    <span class="text-slate-600">Opportunity Score</span>
                                                    <div class="flex items-center">
                                                        <span class="font-bold bg-purple-50 px-1.5 py-0.5 rounded">${p.opportunityScore}</span>
                                                        ${techHelp('Gap = Demand * (1 - Presence). Identical to Competition Gap at this stage.')}
                                                    </div>
                                                </div>
                                                <div class="flex justify-between items-center text-indigo-900" ${bizHelp('Expresses the capacity of a place to transform existing city energy into new opportunity — by joining and amplifying a living ecosystem.')}>
                                                    <span class="text-slate-700 font-medium">Attractiveness Score</span>
                                                    <div class="flex items-center">
                                                        <span class="font-bold bg-indigo-50 px-1.5 py-0.5 rounded">${p.attractivenessScore}</span>
                                                        ${techHelp('Weighted: 0.6*Presence + 0.4*Demand logic. Traditional commercial strength indicators.')}
                                                    </div>
                                                </div>
                                                <div class="flex justify-between items-center text-slate-900" ${bizHelp('Expresses how prepared a place appears to receive business activity in practical terms — as an environment where implementation may be more immediately realistic.')}>
                                                    <span class="text-slate-700">Business Readiness Score</span>
                                                    <div class="flex items-center">
                                                        <span class="font-bold bg-slate-100 px-1.5 py-0.5 rounded">${p.businessReadinessScore}</span>
                                                        ${techHelp('Formula: 0.6*Opp + 0.2*Transit + 0.2*Zoning. Zoning is city-wide placeholder 1.0.')}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="pt-1">
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 border-b border-slate-50 pb-1">Additional Context</p>
                                            <div class="space-y-1.5 text-[11px]">
                                                <div class="flex justify-between items-center">
                                                    <span class="text-slate-600">Customer Potential</span>
                                                    <div class="flex items-center">
                                                        <span class="font-bold text-blue-600">${p.demandScore}</span>
                                                    </div>
                                                </div>
                                                <div class="flex justify-between items-center">
                                                    <span class="text-slate-600">Rel. Business Presence</span>
                                                    <div class="flex items-center">
                                                        <span class="font-bold text-slate-800">${((p.normBizDensity || 0) * 100).toFixed(1)}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="space-y-2 border-t border-slate-100 pt-2">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Accessibility</p>
                                        <div class="space-y-1.5 text-[11px]">
                                            <div class="flex justify-between items-center">
                                                <span class="text-slate-600" ${bizHelp('Availability and frequency of public transit')}>Transit Access Score</span>
                                                <div class="flex items-center">
                                                    <span class="font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">${p.transitAccessScore}</span>
                                                    ${techHelp('0.4*StopsNearby + 0.6*ServiceIntensity. Public connectivity experimental layer.')}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    ${p.fit_summary ? `
                                    <div class="space-y-2 border-t border-indigo-100 pt-3 bg-indigo-50/30 -mx-4 px-4 pb-3 mt-1">
                                        <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest flex justify-between items-center">
                                            <span ${bizHelp('Expresses how well the place and the project appear to belong together, according to the current business-fit model.')}>B. Project-Specific Fit (Match Score)</span>
                                            <span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[9px]">${(p.fit_summary.total_fit_score * 100).toFixed(0)}% Match</span>
                                        </p>
                                        <div class="space-y-1">
                                            <div class="flex flex-wrap gap-1 mt-1">
                                                ${p.fit_summary.strongest_matches.map(m => `<span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold uppercase tracking-tighter">✓ ${m}</span>`).join('')}
                                            </div>
                                            ${p.fit_summary.weak_matches.length > 0 ? `
                                            <div class="flex flex-wrap gap-1 mt-0.5">
                                                ${p.fit_summary.weak_matches.map(m => `<span class="text-[9px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded font-medium border border-amber-100 italic capitalize">Optimization: ${m}</span>`).join('')}
                                            </div>
                                            ` : ''}
                                            <div class="pt-2 mt-2 border-t border-indigo-100/50 space-y-1">
                                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">C. Transparency Indicators</p>
                                                <div class="flex justify-between items-center opacity-85">
                                                    <div class="flex items-center gap-1" ${bizHelp('Indicates how strongly the result is grounded in the current analytical basis, distinguishing direct support from heavier reliance on proxies.')}>
                                                        <span class="text-[9px] font-bold text-indigo-500 uppercase">Analytical Confidence</span>
                                                        <span class="text-[9px] font-black text-indigo-700">${(p.fit_summary.proxy_confidence_score * 100).toFixed(0)}%</span>
                                                    </div>
                                                    <div class="flex items-center gap-1" ${bizHelp('Indicates how complete the current analytical basis is for evaluating this specific business or service concept.')}>
                                                        <span class="text-[9px] font-bold text-indigo-500 uppercase">Data Coverage</span>
                                                        <span class="text-[9px] font-black text-indigo-700">${(p.fit_summary.data_completeness_score * 100).toFixed(0)}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    ` : ''}

                                    <details class="group border-t border-slate-100 pt-2">
                                        <summary class="list-none cursor-pointer text-[10px] font-bold text-slate-500 hover:text-slate-800 flex items-center justify-between py-1">
                                            <span>Show underlying data</span>
                                            <span class="text-[8px] transition-transform group-open:rotate-180">▼</span>
                                        </summary>
                                        <div class="mt-3 space-y-2 animate-in fade-in slide-in-from-top-1 duration-200">
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Market Data</p>
                                            <div class="space-y-1.5 text-[11px]">
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Population</span>
                                                    <span class="font-bold text-slate-700">${(p.pop || 0).toLocaleString()}</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Median Income</span>
                                                    <span class="font-bold text-slate-700">$${(p.income || 0).toLocaleString()}</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Median Age</span>
                                                    <span class="font-bold text-slate-700">${p.age || 'N/A'}</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Bachelors degree holders</span>
                                                    <span class="font-bold text-slate-700">${(parseFloat(p.bachelors) || 0).toFixed(1)}%</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Business Count</span>
                                                    <span class="font-bold text-slate-700">${p.bizCount}</span>
                                                </div>
                                            </div>
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2 border-t pt-2">Public Accessibility</p>
                                            <div class="space-y-1.5 text-[11px]">
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Stops Nearby</span>
                                                    <span class="font-bold text-slate-700">${p.transitStopsNearby || 0}</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-slate-500">Service Intensity</span>
                                                    <span class="font-bold text-slate-700">${(p.transitServiceIntensity || 0).toLocaleString()}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </details>
                                </div>
                            `;
                        }, { className: 'custom-popup', maxWidth: 300 });
                    }
                }).addTo(mapRef.current);
            };

            useEffect(() => {
                mapRef.current = L.map('map', { zoomControl: false }).setView([32.3668, -86.3000], 11);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
                }).addTo(mapRef.current);
                fetchAndProcessData();
                return () => mapRef.current.remove();
            }, []);

            useEffect(() => {
                if (!geoJsonData) return;
                
                // Deep clone to avoid direct property mutation of base data
                const updatedGeo = JSON.parse(JSON.stringify(geoJsonData));
                
                updatedGeo.features = updatedGeo.features.map(f => {
                    const p = f.properties;
                    f.properties.fit_summary = computeTractFit(interpretedIntent, p.standardized_indicators, mappingConfig);
                    return f;
                });
                
				if (interpretedIntent) {
					const ranked = updatedGeo.features
						.filter(f => f.properties.fit_summary && f.properties.fit_summary.total_fit_score > 0)
						.sort((a, b) => b.properties.fit_summary.total_fit_score - a.properties.fit_summary.total_fit_score)
						.slice(0, 3)
						.map(f => ({
							tract: f.properties.TRACT,
							geoid: f.properties.GEOID,
							score: f.properties.fit_summary.total_fit_score,
							archetype: f.properties.archetype,
							strongest: f.properties.fit_summary.strongest_matches,
							income: f.properties.income,
							family_area: f.properties.standardized_indicators?.family_proxy || 0
						}));
					setTopMatches(ranked);
				}
                renderMap(updatedGeo);
                
                // Update selected tract context if a tract is currently selected
                if (selectedTract) {
                    const match = updatedGeo.features.find(f => f.properties.GEOID === selectedTract.GEOID);
                    if (match) setSelectedTract(match.properties);
                }
            }, [geoJsonData, interpretedIntent, mappingConfig]);

            useEffect(() => {
                if (geoJsonLayerRef.current) {
                    geoJsonLayerRef.current.eachLayer((layer) => {
                        const props = layer.feature.properties;
                        const val = viewMode === 'income' ? props.income : props.opportunityScore;
                        layer.setStyle({ fillColor: getColor(val, viewMode) });
                    });
                }
            }, [viewMode]);

            useEffect(() => {
                if (isMockMode && (uiMode === 'map' || uiMode === 'report')) {
                    setUiMode('intent');
                }
            }, [isMockMode]);

            return (
                <div className="relative w-full h-screen overflow-hidden flex flex-col md:flex-row">
                    {/* Navigation */}					
					{isMockMode && (
						<button
							onClick={() => setShowErrorDialog(true)}
							disabled={!error}
